<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 390" width="852" height="390" font-family="Manrope, Inter, Arial, sans-serif"><text x="0" y="22" font-size="21" font-weight="650" fill="#0b78d1" text-anchor="start">Промышленная база</text><text x="448" y="22" font-size="21" font-weight="650" fill="#0b78d1" text-anchor="start">Рыночные решения</text><rect x="0" y="43" width="404" height="76" rx="7" fill="#ffffff" stroke="#bdd5ea"/><text x="13" y="72" font-size="22" font-weight="700" fill="#0b78d1" text-anchor="start">1935</text><text x="120" y="72" font-size="22" font-weight="650" fill="#0f1720" text-anchor="start">Комбинат</text><text x="13" y="98" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">Шахты, заводы, энергетика</text><rect x="0" y="135" width="404" height="76" rx="7" fill="#ffffff" stroke="#bdd5ea"/><text x="13" y="164" font-size="22" font-weight="700" fill="#0b78d1" text-anchor="start">1960</text><text x="120" y="164" font-size="22" font-weight="650" fill="#0f1720" text-anchor="start">Талнах</text><text x="13" y="190" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">Уникальные полиметаллические руды</text><rect x="448" y="43" width="404" height="76" rx="7" fill="#ffffff" stroke="#bdd5ea"/><text x="461" y="72" font-size="22" font-weight="700" fill="#0b78d1" text-anchor="start">1990-е</text><text x="568" y="72" font-size="22" font-weight="650" fill="#0f1720" text-anchor="start">Экспорт</text><text x="461" y="98" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">Выход на внешний спрос</text><rect x="448" y="135" width="404" height="76" rx="7" fill="#ffffff" stroke="#bdd5ea"/><text x="461" y="164" font-size="22" font-weight="700" fill="#0b78d1" text-anchor="start">2013</text><text x="568" y="164" font-size="22" font-weight="650" fill="#0f1720" text-anchor="start">Новая стратегия</text><text x="461" y="190" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">Фокус на сильных активах</text><rect x="0" y="226" width="404" height="145" rx="8" fill="#eef6ff" stroke="none"/><text x="15" y="255" font-size="21" font-weight="650" fill="#0f1720" text-anchor="start">Вертикальная интеграция</text><text x="15" y="285" font-size="19" font-weight="500" fill="#0b78d1" text-anchor="start">Шахты · заводы · порт · флот</text><text x="15" y="324" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">Собственная логистика в Арктике</text><text x="448" y="248" font-size="20" font-weight="650" fill="#0f1720" text-anchor="start">Мировая значимость</text><rect x="448" y="266" width="404" height="105" rx="8" fill="#eef6ff" stroke="none"/><text x="466" y="304" font-size="38" font-weight="800" fill="#0b78d1" text-anchor="start">≈ 20%</text><text x="646" y="302" font-size="22" font-weight="650" fill="#0f1720" text-anchor="start">мирового никеля</text><text x="466" y="331" font-size="17" font-weight="500" fill="#3c5366" text-anchor="start">оценка ОЭСР для конца 1990-х</text><line x1="466" y1="345" x2="834" y2="345" stroke="#bdd5ea" stroke-width="1"/><text x="466" y="366" font-size="16" font-weight="500" fill="#3c5366" text-anchor="start">Компания была заметным мировым игроком уже в 1990-е</text></svg>